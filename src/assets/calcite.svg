<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="100%" height="100%">
    <defs>
        <!-- Gradients for the main faces to simulate lighting -->
        <linearGradient id="grad-tl" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#354526" />
            <stop offset="100%" stop-color="#0a1005" />
        </linearGradient>

        <linearGradient id="grad-tr" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#c8d0c2" />
            <stop offset="50%" stop-color="#9ca794" />
            <stop offset="100%" stop-color="#687360" />
        </linearGradient>

        <linearGradient id="grad-bl" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2c3b1e" />
            <stop offset="100%" stop-color="#151f0e" />
        </linearGradient>

        <linearGradient id="grad-br" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#243018" />
            <stop offset="100%" stop-color="#0b1006" />
        </linearGradient>

        <!-- 内部填充渐变 -->
        <linearGradient id="pattern-grad" x1="0" y1="150" x2="0" y2="380"
            gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#608a30" />
            <stop offset="100%" stop-color="#3b571d" />
        </linearGradient>

        <!-- Clip paths -->
        <clipPath id="clip-bl">
            <polygon points="100,160 20,150 100,380" />
        </clipPath>
        <clipPath id="clip-br">
            <polygon points="100,160 180,150 100,380" />
        </clipPath>
    </defs>

    <!-- Base Solid Faces -->
    <polygon points="100,20 20,150 100,160" fill="url(#grad-tl)" />
    <polygon points="100,20 180,150 100,160" fill="url(#grad-tr)" />
    <polygon points="100,160 20,150 100,380" fill="url(#grad-bl)" />
    <polygon points="100,160 180,150 100,380" fill="url(#grad-br)" />

    <!-- Specular Highlights & Reflections -->
    <path d="M 100,20 L 20,150 L 28,150 L 100,32 Z" fill="#b4d29b" opacity="0.65" />

    <!-- Gonna add something in the future. -->

    <!-- Thick Black Outlines -->
    <polygon points="100,20 180,150 100,380 20,150" fill="none" stroke="#050803" stroke-width="5"
        stroke-linejoin="round" />

    <!-- Center & Equator Edges -->
    <line x1="20" y1="150" x2="100" y2="160" stroke="#050803" stroke-width="4.5"
        stroke-linecap="round" />
    <line x1="180" y1="150" x2="100" y2="160" stroke="#050803" stroke-width="4.5"
        stroke-linecap="round" />
    <line x1="100" y1="20" x2="100" y2="380" stroke="#050803" stroke-width="4.5"
        stroke-linecap="round" />

</svg>